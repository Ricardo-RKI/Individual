<!DOCTYPE html>
<html lang="pt-br">

<head>

    <link rel="icon" href="../assets/img/flavicontemporalis.png">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporalis | Históricos </title>


    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />
    <script src="../js/sessao.js"></script>
    <script src="./../js/alerta.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <!-- scripts do Chart.js - 2022-1 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>



    <!-- <body onload=" atualizarFeed()"> -->

<body>

    <div class="header">
        <div class="container">
            <h1 class="titulo"><img src="../assets/img/Temporalis_Logo.png" alt=""></h1>

            <p> Olá, <span id="usuario"> Usuário! </span>! </p>

            <ul class="navbar">
                <li>
                    <a href="rolagens.html">Rolagens</a>
                </li>
                <li class="agora">
                    <a href="historico.html"> Histórico </a>
                </li>
                <li>
                    <a class="link_sair" href="/public/index.html"> Sair </a>
                </li>
            </ul>
        </div>
    </div>

    <div class="kpi_e_graficos">

        <div class="kpis">

            <div class="kpi">

                <p> Total de Rolagens </p>
                <span id="rolagens_totais"> 0 </span>

            </div>

            <div class="kpi">
                <p> Total de Sucessos </p>
                <span id="sucessos_totais"> 0 </span>
            </div>

            <div class="kpi">
                <p> Total de Fracasssos </p>
                <span id="fracassos_totais"> 0 </span>
            </div>

            <div class="kpi">
                <p> Média de Sucessos por Rolagem </p>
                <span id="media"> 0 </span>
            </div>

        </div>

        <div class="graficos_rosquinha">
            <div class="rosquinha_total">
                <canvas id="grafico_total"> </canvas>
            </div>
            <div class="rosquinha_percentual">
                <canvas id="grafico_percentual"> </canvas>
            </div>
        </div>
    
    <div class = "linha_do_tempo"> 
        <canvas id = "grafico_linha_do_tempo"> 
        </canvas>
    </div>

    </div>




</body>

</html>

<script>

    window.onload = procurarDados()

    usuario.innerHTML = sessionStorage.NOME_USUARIO;
    let rolagem_total = 0;
    let proximaAtualizacao;


    function procurarDados() {
        var id_usuario = sessionStorage.ID_USUARIO;
        fetch(`/dashboard/listar/${id_usuario}`, {
            method: "GET",
            headers: {
                "Content-Type": "application/json",
            },
        }).then(function (resposta) {
            console.log("resposta:", resposta);
            if (resposta.ok) {
                console.log("tudo_okay")

                resposta.json().then(json => {

                    let dataTotalRosquinha = [];
                    let dataPercentualRosquinha = [];

                    rolagens_totais.innerHTML = json.rolagens;
                    sucessos_totais.innerHTML = json.sucessos;
                    fracassos_totais.innerHTML = json.fracassos;
                    media.innerHTML = Number(json.media) * 100 + "%";

                    dataTotalRosquinha.push(json.rolagens);
                    dataTotalRosquinha.push(json.sucessos);
                    dataTotalRosquinha.push(json.fracassos);
                    dataPercentualRosquinha.push(Number(json.media) * 100)

                    console.log("data Total:" + dataTotalRosquinha);
                    console.log("data Percentual:" + dataPercentualRosquinha);

                    plotarGraficoRosquinha(dataTotalRosquinha, dataPercentualRosquinha);
                    procurarDadosLinhaTempo();
                })




            } else {
                throw "Houve um erro ao tentar mandar os dados"
            }
        })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`)
            })

        return false

    }
   function plotarGraficoRosquinha(dataRosquinhaTotal, dataRosquinhaPercentual) {

        const grafico_rosquinha_total = document.getElementById('grafico_total');
        const grafico_rosquinha_percentual = document.getElementById('grafico_percentual');

        new Chart(grafico_rosquinha_total, {
            type: 'doughnut',
            data: {
                labels: ['Total Rolagens', 'Total Sucessos', 'Total Fracassos'],
                datasets: [{
                    label: 'Quantidade Total',
                    data: dataRosquinhaTotal,
                    backgroundColor: ['aquamarine', 'green', 'red'],
                    borderWidth: 1
                }]
            },
            options: {
                plugins: {
                    title: {
                        display: true,
                        text: 'Total de Rolagens, Sucessos e Fracassos',
                        color: 'white',
                        font: {
                            size: 20,
                            weight: 'bold',
                        }
                    }
                }
            }
        })

        new Chart(grafico_rosquinha_percentual, {
            type: 'doughnut',
            data: {
                labels: ['Média de Sucessos', 'Média de Fracassos'],
                datasets: [{
                    label: 'Média Resultante',
                    data: [dataRosquinhaPercentual, 100 - Number(dataRosquinhaPercentual) ],
                    backgroundColor: ['green', 'red'],
                    borderWidth: 1
                }]
            },
            options: {
                plugins: {
                    title: {
                        display: true,
                        text: 'Percentual de Sucessos e Fracassos (%)',
                        color: 'white',
                        font: {
                            size: 20,
                            weight: 'bold',
                        }
                    }
                }
            }
        })
    }

    function procurarDadosLinhaTempo() {

        var id_usuario = sessionStorage.ID_USUARIO;
        fetch(`/dashboard/linhaTempo/${id_usuario}`, {
            method: "GET",
            headers: {
                "Content-Type": "application/json",
            },
        }).then(function (resposta) {
            console.log("resposta:", resposta);
            if (resposta.ok) {

                console.log("tudo_okay")

                resposta.json().then(json => {

                    let data_rolagem = [];
                    let total_dados = [];
                    console.log("Json da Linha do Tempo"  + json)
                    for(let i = 0; i < json.length; i++) {
                    data_rolagem.push(json[i].data_dia);
                    total_dados.push(json[i].total_rolagens);
                    }
                    
                    

                    console.log("Data Rolagens:" + data_rolagem);
                    console.log("Total Rolagens:" + total_dados);

                    plotarGraficoLinhaTempo(data_rolagem, total_dados);
              
                })




            } else {
                throw "Houve um erro ao tentar mandar os dados"
            }
        })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`)
            })

        return false
    }
function plotarGraficoLinhaTempo(data_rolagem, total_dados) {
    const grafico_historico = document.getElementById('grafico_linha_do_tempo')

    new Chart(grafico_historico, {
        type: 'line',
        data: {
            labels: data_rolagem, 
            datasets: [{
                label: ['Quantidade de Rolagens'],
                data: total_dados,
                backgroundColor: 'aquamarine',
                borderColor: 'aquamarine',
                borderWidth: 1,
            }]
        }, 
        options: {
            plugins: {
            title: {
                display: true,
                text: 'Linha do Tempo da sua Atividade',
                color: 'white', 
                font: {
                    size: 20,
                    weight: 'bold',
                }
            }
        },
            scales: {
                y: {
                    beginAtZero: true,
                    color: 'white',
                    font: {
                        size: 16,
                        weight: 'bold'
                    }
                },
                x: {
                    color: 'white',
                    font: {
                        size: 16,
                        weight: 'bold'
                    }
                }
            }
        }
    })
}
</script>
